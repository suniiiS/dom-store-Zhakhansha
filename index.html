<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Магазин</h1>

  <form id="add-form" novalidate>
    <label>Название
      <input name="name" type="text">
      <span class="error" data-for="name"></span>
    </label>
    <label>Цена
      <input name="price" type="text">
      <span class="error" data-for="price"></span>
    </label>
    <label>Кол-во
      <input name="qty" type="text">
      <span class="error" data-for="qty"></span>
    </label>
    <button type="submit">Добавить</button>
  </form>

  <table>
    <thead><tr><th>Название</th><th>Цена</th><th>Кол-во</th><th>Сумма</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>

  <p>Итого: <strong id="total">0</strong></p>

  <script type="module" src="src/main.js"></script>
</body>
</html>
